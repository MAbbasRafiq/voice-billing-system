{% extends "base.html" %}
{% block title %}Bill History{% endblock %}

{% block content %}
<div class="card-soft rounded-xl p-4">
  <div class="flex flex-wrap items-end justify-between gap-3 mb-3">
    <h1 class="font-display text-2xl font-semibold">Past bills</h1>
    <div id="today-summary" class="text-sm text-slate-600 rounded-lg border border-slate-200 bg-white px-3 py-2">
      Today: …
    </div>
  </div>
  <div class="overflow-auto">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-900 text-white">
        <tr>
          <th class="text-left px-2 py-2">Bill #</th>
          <th class="text-left px-2 py-2">Date</th>
          <th class="text-left px-2 py-2">Customer</th>
          <th class="text-right px-2 py-2">Total (PKR)</th>
          <th class="text-right px-2 py-2">Actions</th>
        </tr>
      </thead>
      <tbody id="hist-body"></tbody>
    </table>
  </div>
</div>
<script>
async function loadHistory() {
  const res = await fetch('/api/history');
  const data = await res.json();
  const bills = data.bills || [];
  let today = data.today || null;

  // Fallback: compute "today" in the browser if API omitted it or date filter missed
  if (!today || (today.bill_count === 0 && bills.length)) {
    const localDay = new Date();
    const y = localDay.getFullYear();
    const m = String(localDay.getMonth() + 1).padStart(2, '0');
    const d = String(localDay.getDate()).padStart(2, '0');
    const key = y + '-' + m + '-' + d;
    let bill_count = 0;
    let total = 0;
    bills.forEach((b) => {
      const created = String(b.created_at || '');
      if (created.slice(0, 10) === key) {
        bill_count += 1;
        total += Number(b.total || 0);
      }
    });
    if (bill_count > 0 || !today) {
      today = { bill_count, total };
    }
  }

  const sumEl = document.getElementById('today-summary');
  if (sumEl) {
    sumEl.innerHTML =
      '<span class="font-medium text-ink">Today</span> · ' +
      (today.bill_count || 0) + ' bill(s) · ' +
      '<strong>' + Number(today.total || 0).toFixed(2) + ' PKR</strong>';
  }
  document.getElementById('hist-body').innerHTML = bills.map(b => `
    <tr class="border-b border-slate-100">
      <td class="px-2 py-2">#${b.id}</td>
      <td class="px-2 py-2">${b.created_at || ''}</td>
      <td class="px-2 py-2">${b.customer || '—'}</td>
      <td class="px-2 py-2 text-right font-medium">${Number(b.total || 0).toFixed(2)}</td>
      <td class="px-2 py-2 text-right space-x-3 whitespace-nowrap">
        <a class="text-accent underline" href="/api/bill/${b.id}/pdf" target="_blank">PDF</a>
        <a class="text-slate-700 underline" href="/?repeat=${b.id}">Reuse</a>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="5" class="px-2 py-6 text-center text-slate-500">No bills yet</td></tr>';
}
loadHistory();
</script>
{% endblock %}
