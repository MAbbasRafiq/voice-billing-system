{% extends "base.html" %}
{% block title %}Catalog{% endblock %}

{% block content %}
<div class="card-soft rounded-xl p-4">
  <h1 class="font-display text-2xl font-semibold mb-3">Item catalog</h1>
  <div class="flex flex-wrap gap-2 mb-4">
    <input id="cat-q" type="search" placeholder="Search…" class="rounded-lg border px-3 py-2 flex-1 min-w-[200px]" />
    <select id="cat-category" class="rounded-lg border px-3 py-2">
      <option value="">All categories</option>
    </select>
    <button id="cat-go" type="button" class="px-4 py-2 rounded-lg bg-slate-900 text-white">Filter</button>
  </div>
  <p id="cat-meta" class="text-sm text-slate-500 mb-2"></p>
  <div class="overflow-auto">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-900 text-white">
        <tr>
          <th class="text-left px-2 py-2">Code</th>
          <th class="text-left px-2 py-2">Model</th>
          <th class="text-left px-2 py-2">Name</th>
          <th class="text-left px-2 py-2">Category</th>
          <th class="text-right px-2 py-2">CP</th>
          <th class="text-right px-2 py-2">FOC</th>
        </tr>
      </thead>
      <tbody id="cat-body"></tbody>
    </table>
  </div>
  <div class="mt-3 flex justify-center">
    <button id="cat-more" type="button" class="hidden px-4 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm font-medium">
      Load more
    </button>
  </div>
</div>
<script>
const PAGE_SIZE = 500;
let catSeq = 0;
let catAbort = null;
let catOffset = 0;
let catTotal = 0;
let catLoading = false;

function rowHtml(it) {
  const nameHtml = window.formatCatalogName
    ? formatCatalogName(it)
    : (it.name || '');
  return `
    <tr class="border-b border-slate-100 hover:bg-white/70">
      <td class="px-2 py-1.5 font-mono text-xs">${it.item_code || ''}</td>
      <td class="px-2 py-1.5">${it.model || ''}</td>
      <td class="px-2 py-1.5">${nameHtml}</td>
      <td class="px-2 py-1.5 text-slate-500">${it.category || ''}</td>
      <td class="px-2 py-1.5 text-right">${Number(it.cp).toFixed(2)}</td>
      <td class="px-2 py-1.5 text-right">${it.foc_qty ? (it.foc_qty + '→' + (it.foc_units||0)) : '—'}</td>
    </tr>
  `;
}

function updateMeta(shown) {
  const meta = document.getElementById('cat-meta');
  const more = document.getElementById('cat-more');
  if (!catTotal) {
    meta.textContent = 'No items match.';
    more.classList.add('hidden');
    return;
  }
  meta.textContent = `Showing ${shown} of ${catTotal}`;
  if (shown < catTotal) more.classList.remove('hidden');
  else more.classList.add('hidden');
}

async function loadCatalog({ append = false } = {}) {
  if (catLoading) return;
  const q = document.getElementById('cat-q').value.trim();
  const category = document.getElementById('cat-category').value;
  if (!append) catOffset = 0;
  const params = new URLSearchParams({
    limit: String(PAGE_SIZE),
    offset: String(catOffset),
  });
  if (q) params.set('q', q);
  if (category) params.set('category', category);
  const seq = ++catSeq;
  if (catAbort) catAbort.abort();
  catAbort = new AbortController();
  catLoading = true;
  const moreBtn = document.getElementById('cat-more');
  moreBtn.disabled = true;
  moreBtn.textContent = 'Loading…';
  let data;
  try {
    const res = await fetch('/api/catalog?' + params.toString(), { signal: catAbort.signal });
    data = await res.json();
  } catch (err) {
    catLoading = false;
    moreBtn.disabled = false;
    moreBtn.textContent = 'Load more';
    return; // aborted by a newer keystroke, or server unreachable
  }
  if (seq !== catSeq) {
    catLoading = false;
    return; // stale response
  }
  const sel = document.getElementById('cat-category');
  if (sel.options.length <= 1) {
    (data.categories || []).forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  }
  const body = document.getElementById('cat-body');
  const rows = (data.items || []).map(rowHtml).join('');
  if (append) body.insertAdjacentHTML('beforeend', rows);
  else body.innerHTML = rows;
  catTotal = data.total || 0;
  catOffset += (data.items || []).length;
  updateMeta(catOffset);
  catLoading = false;
  moreBtn.disabled = false;
  moreBtn.textContent = 'Load more';
}

document.getElementById('cat-go').addEventListener('click', () => loadCatalog());
document.getElementById('cat-more').addEventListener('click', () => loadCatalog({ append: true }));
// Filter while typing (debounced); Enter / category change apply immediately
let catTimer = null;
document.getElementById('cat-q').addEventListener('input', () => {
  clearTimeout(catTimer);
  catTimer = setTimeout(() => loadCatalog(), 150);
});
document.getElementById('cat-q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(catTimer); loadCatalog(); }
});
document.getElementById('cat-category').addEventListener('change', () => loadCatalog());
window.addEventListener('catalog-display-lang', () => loadCatalog());
loadCatalog();
</script>
{% endblock %}
