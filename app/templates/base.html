<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Billing System{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0f172a',
            panel: '#f8fafc',
            accent: '#0f766e',
            accent2: '#b45309',
          },
          fontFamily: {
            display: ['"Segoe UI"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            body: ['"Segoe UI"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(15,118,110,0.12), transparent 55%),
        radial-gradient(900px 400px at 100% 0%, rgba(180,83,9,0.10), transparent 50%),
        #f1f5f9;
      min-height: 100vh;
    }
    .card-soft {
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(15,23,42,0.08);
      box-shadow: 0 10px 30px rgba(15,23,42,0.06);
    }
    .foc-row { background: #dcfce7; color: #166534; }
    .match-card.selected { outline: 2px solid #0f766e; background: #f0fdfa; }
    .match-card.focused { box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.35); }
    .qty-input {
      min-width: 5.5rem;
      height: 2.35rem;
    }
    .qty-chip {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.35rem;
      background: #fff;
      line-height: 1.2;
    }
    .qty-chip:hover { background: #f1f5f9; }
    .model-chip {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
    }
    .model-chip.active { background: #0f766e; color: #fff; border-color: #0f766e; }
    .catalog-lang-toggle .model-chip { min-width: 2.5rem; text-align: center; }
    .catalog-name-ur,
    .catalog-name-ur-style {
      display: block;
      margin-top: 0.2rem;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      color: #0f172a;
    }
    .catalog-name-en-fallback {
      font-weight: 500;
      font-size: inherit;
    }
    .catalog-name-ur:only-child {
      display: inline;
      margin-top: 0;
    }
    #mode-banner.fuzzy { background: #fff7ed; color: #9a3412; border-color: #fdba74; }
    #mode-banner.groq { background: #ecfdf5; color: #065f46; border-color: #6ee7b7; }
    #mode-banner.local { background: #ecfdf5; color: #065f46; border-color: #6ee7b7; }
    #mode-banner.gemini { background: #eff6ff; color: #1e40af; border-color: #93c5fd; }
  </style>
  <script src="/static/js/catalog_display.js"></script>
</head>
<body class="font-body text-ink">
  <header class="border-b border-slate-200/80 bg-white/70 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <a href="/" class="font-display text-xl font-semibold tracking-tight">
        Spare Parts <span class="text-accent">Billing</span>
      </a>
      <nav class="flex flex-wrap items-center gap-2 text-sm">
        <div id="catalog-lang-toggle" class="catalog-lang-toggle flex items-center gap-1 mr-1"
          title="Catalog name display (verify only; search stays English)">
          <span class="text-xs text-slate-500 hidden sm:inline">Names</span>
          <button type="button" data-catalog-lang="en" class="model-chip">EN</button>
          <button type="button" data-catalog-lang="ur" class="model-chip">اردو</button>
          <button type="button" data-catalog-lang="both" class="model-chip">Both</button>
        </div>
        <a class="px-3 py-1.5 rounded-md hover:bg-slate-100 {% if active|default('') == 'billing' %}bg-slate-900 text-white hover:bg-slate-900{% endif %}" href="/">Billing</a>
        <a class="px-3 py-1.5 rounded-md hover:bg-slate-100 {% if active|default('') == 'catalog' %}bg-slate-900 text-white hover:bg-slate-900{% endif %}" href="/catalog">Catalog</a>
        <a class="px-3 py-1.5 rounded-md hover:bg-slate-100 {% if active|default('') == 'history' %}bg-slate-900 text-white hover:bg-slate-900{% endif %}" href="/history">History</a>
        <a class="px-3 py-1.5 rounded-md hover:bg-slate-100 {% if active|default('') == 'settings' %}bg-slate-900 text-white hover:bg-slate-900{% endif %}" href="/settings">Settings</a>
      </nav>
    </div>
  </header>

  <div id="mode-banner" class="max-w-7xl mx-auto px-4 mt-3 text-sm border rounded-md px-3 py-2 fuzzy">
    Checking AI mode…
  </div>
  <p id="offline-hint" class="hidden max-w-7xl mx-auto px-4 mt-1 text-xs text-amber-800">
    Offline / fuzzy mode: voice parse uses local matching only. Add an API key in Settings for better Urdu &amp; name picking.
  </p>

  <main class="max-w-7xl mx-auto px-4 py-5">
    {% block content %}{% endblock %}
  </main>

  <script>
    async function refreshModeBanner() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const el = document.getElementById('mode-banner');
        el.className = 'max-w-7xl mx-auto px-4 mt-3 text-sm border rounded-md px-3 py-2 ' + (data.mode || 'fuzzy');
        el.textContent = data.mode_label + ' · ' + (data.item_count || 0) + ' items in catalog';
        window.__billingStatus = data;
        const hint = document.getElementById('offline-hint');
        if (hint) {
          if (data.offline || data.mode === 'fuzzy') hint.classList.remove('hidden');
          else hint.classList.add('hidden');
        }
      } catch (e) {
        const el = document.getElementById('mode-banner');
        el.textContent = 'Status unavailable';
      }
    }
    refreshModeBanner();
    if (window.wireCatalogDisplayToggle) {
      wireCatalogDisplayToggle('#catalog-lang-toggle');
    }
    window.addEventListener('catalog-display-lang', () => {
      const mode = getCatalogDisplayMode();
      document.querySelectorAll('.catalog-lang-toggle').forEach((box) => {
        box.querySelectorAll('[data-catalog-lang]').forEach((b) => {
          const on = b.getAttribute('data-catalog-lang') === mode;
          b.classList.toggle('active', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
